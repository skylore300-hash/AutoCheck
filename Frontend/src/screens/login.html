<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCheck - Connexion</title>
    <link href="../output.css" rel="stylesheet">
</head>
<body style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin: 0; padding: 0; min-height: 100vh;">
    <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;">
        <div class="card" style="width: 28rem; max-width: 100%;">
            <!-- Header -->
            <div class="text-center mb-8">
                <div style="width: 4rem; height: 4rem; background-color: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1rem;">
                    <svg style="width: 2rem; height: 2rem; color: white;" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <h1 style="font-size: 1.875rem; font-weight: bold; color: #1f2937; margin-bottom: 0.5rem;">AutoCheck</h1>
                <p style="color: #6b7280;">Système de Vérification Véhicules</p>
            </div>

            <!-- Formulaire de connexion -->
            <form id="loginForm" style="margin-bottom: 1.5rem;">
                <!-- Type d'utilisateur -->
                <div style="margin-bottom: 1rem;">
                    <label style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">
                        Type d'utilisateur *
                    </label>
                    <select id="userRole" class="input-field" required>
                        <option value="">Sélectionner votre rôle</option>
                        <option value="police">👮 Agent de Police</option>
                        <option value="insurance">🏢 Agent d'Assurance</option>
                        <option value="transport">🚛 Agent Transport</option>
                        <option value="admin">⚙️ Administrateur</option>
                    </select>
                </div>

                <!-- Email / Matricule -->
                <div style="margin-bottom: 1rem;">
                    <label for="identifier" style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">
                        Email / Matricule *
                    </label>
                    <input 
                        type="text" 
                        id="identifier" 
                        class="input-field" 
                        placeholder="Entrez votre email ou matricule"
                        required
                        autocomplete="username"
                    >
                </div>

                <!-- Mot de passe -->
                <div style="margin-bottom: 1rem;">
                    <label for="password" style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">
                        Mot de passe *
                    </label>
                    <div style="position: relative;">
                        <input 
                            type="password" 
                            id="password" 
                            class="input-field" 
                            placeholder="Entrez votre mot de passe"
                            required
                            autocomplete="current-password"
                        >
                        <button 
                            type="button" 
                            id="togglePassword"
                            style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: #6b7280; cursor: pointer;"
                            onclick="togglePasswordVisibility()"
                        >
                            <svg id="eyeIcon" style="width: 1.25rem; height: 1.25rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Authentification 2FA -->
                <div id="twoFASection" style="margin-bottom: 1rem; display: none;">
                    <label for="twoFACode" style="display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.5rem;">
                        Code d'authentification 2FA
                    </label>
                    <input 
                        type="text" 
                        id="twoFACode" 
                        class="input-field" 
                        placeholder="Entrez le code à 6 chiffres"
                        maxlength="6"
                        pattern="[0-9]{6}"
                    >
                    <p style="font-size: 0.75rem; color: #6b7280; margin-top: 0.25rem;">
                        Entrez le code de votre application d'authentification
                    </p>
                </div>

                <!-- Options -->
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <label style="display: flex; align-items: center; font-size: 0.875rem; color: #374151;">
                        <input type="checkbox" id="rememberMe" style="margin-right: 0.5rem;">
                        Se souvenir de moi
                    </label>
                    <a href="#" onclick="showForgotPassword()" style="font-size: 0.875rem; color: #3b82f6; text-decoration: none;">
                        Mot de passe oublié ?
                    </a>
                </div>

                <!-- Bouton de connexion -->
                <button type="submit" class="btn-primary" style="width: 100%; margin-bottom: 1rem;" id="loginButton">
                    <span id="loginButtonText">Se connecter</span>
                    <div id="loginSpinner" class="loading-spinner" style="display: none; width: 1.25rem; height: 1.25rem; margin: 0 auto;"></div>
                </button>

                <!-- Mode urgence -->
                <div style="text-align: center; margin-bottom: 1rem;">
                    <button type="button" class="btn-warning" style="font-size: 0.875rem;" onclick="showEmergencyAccess()">
                        🚨 Accès d'urgence
                    </button>
                </div>
            </form>

            <!-- Statut de connexion -->
            <div id="connectionStatus" style="text-align: center; font-size: 0.875rem; color: #6b7280;">
                <div style="display: flex; align-items: center; justify-content: center; gap: 0.5rem;">
                    <div id="connectionDot" style="width: 0.5rem; height: 0.5rem; border-radius: 50%; background-color: #10b981;"></div>
                    <span id="connectionText">Serveur connecté</span>
                </div>
            </div>

            <!-- Informations système -->
            <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid #e5e7eb; text-align: center; font-size: 0.75rem; color: #9ca3af;">
                <p>Version 1.0.0 | © 2026 AutoCheck</p>
                <p id="systemInfo">Système sécurisé</p>
            </div>
        </div>
    </div>

    <!-- Modal mode urgence -->
    <div id="emergencyModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 50; display: none;">
        <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1rem;">
            <div class="card" style="width: 24rem;">
                <h3 style="font-size: 1.25rem; font-weight: bold; margin-bottom: 1rem; text-align: center; color: #dc2626;">
                    🚨 Accès d'Urgence
                </h3>
                <p style="color: #6b7280; margin-bottom: 1rem; text-align: center; font-size: 0.875rem;">
                    En cas d'urgence uniquement. Cet accès sera enregistré et monitored.
                </p>
                <div style="margin-bottom: 1rem;">
                    <input 
                        type="text" 
                        id="emergencyCode" 
                        class="input-field" 
                        placeholder="Code d'urgence"
                        maxlength="8"
                    >
                </div>
                <div style="display: flex; gap: 0.75rem;">
                    <button class="btn-secondary" style="flex: 1;" onclick="hideEmergencyAccess()">
                        Annuler
                    </button>
                    <button class="btn-danger" style="flex: 1;" onclick="processEmergencyAccess()">
                        Accéder
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        // Vérifier l'utilisateur connecté au chargement
        document.addEventListener('DOMContentLoaded', () => {
            const user = autoCheck.getCurrentUser();
            if (user) {
                // Rediriger vers le dashboard si déjà connecté
                autoCheck.navigateTo('dashboard');
            }

            // Vérifier le statut de connexion
            checkServerConnection();

            // Mettre à jour les infos système
            updateSystemInfo();

            // Écouter les changements de rôle pour afficher/masquer 2FA
            document.getElementById('userRole').addEventListener('change', handleRoleChange);

            // Focus sur le premier champ
            document.getElementById('identifier').focus();
        });

        // Gestion du formulaire de connexion
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const identifier = document.getElementById('identifier').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('userRole').value;
            const twoFACode = document.getElementById('twoFACode').value;
            const rememberMe = document.getElementById('rememberMe').checked;

            if (!identifier || !password || !role) {
                autoCheck.showNotification('Erreur', 'Tous les champs sont requis', 'error');
                return;
            }

            // Vérifier 2FA pour admin et police
            if ((role === 'admin' || role === 'police') && !twoFACode) {
                autoCheck.showNotification('2FA Requis', 'Code d\'authentification requis pour ce rôle', 'warning');
                return;
            }

            // Afficher le loading
            showLoginLoading(true);

            try {
                // Simulation de l'authentification
                const user = await autoCheck.login({
                    email: identifier,
                    matricule: identifier,
                    password,
                    role,
                    twoFA: twoFACode,
                    rememberMe
                });

                autoCheck.showNotification('Connexion Réussie', `Bienvenue ${user.name}!`, 'success');
                
                // Redirection après 1 seconde
                setTimeout(() => {
                    autoCheck.navigateTo('dashboard');
                }, 1000);

            } catch (error) {
                autoCheck.showNotification('Erreur de Connexion', 'Vérifiez vos identifiants', 'error');
                showLoginLoading(false);
            }
        });

        // Afficher/masquer le loading du bouton de connexion
        function showLoginLoading(show) {
            const button = document.getElementById('loginButton');
            const text = document.getElementById('loginButtonText');
            const spinner = document.getElementById('loginSpinner');

            if (show) {
                button.disabled = true;
                text.style.display = 'none';
                spinner.style.display = 'block';
            } else {
                button.disabled = false;
                text.style.display = 'inline';
                spinner.style.display = 'none';
            }
        }

        // Gérer le changement de rôle
        function handleRoleChange() {
            const role = document.getElementById('userRole').value;
            const twoFASection = document.getElementById('twoFASection');
            
            // Afficher 2FA pour admin et police
            if (role === 'admin' || role === 'police') {
                twoFASection.style.display = 'block';
            } else {
                twoFASection.style.display = 'none';
            }
        }

        // Basculer la visibilité du mot de passe
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
                `;
            } else {
                passwordInput.type = 'password';
                eyeIcon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                `;
            }
        }

        // Afficher le modal d'accès d'urgence
        function showEmergencyAccess() {
            document.getElementById('emergencyModal').style.display = 'flex';
            document.getElementById('emergencyCode').focus();
        }

        // Masquer le modal d'accès d'urgence
        function hideEmergencyAccess() {
            document.getElementById('emergencyModal').style.display = 'none';
            document.getElementById('emergencyCode').value = '';
        }

        // Traiter l'accès d'urgence
        function processEmergencyAccess() {
            const code = document.getElementById('emergencyCode').value;
            
            if (!code) {
                autoCheck.showNotification('Code Requis', 'Entrez le code d\'urgence', 'warning');
                return;
            }

            // Code d'urgence simulé
            if (code === 'EMRG2026') {
                autoCheck.showNotification('Accès d\'Urgence Activé', 'Session limitée activée', 'warning');
                hideEmergencyAccess();
                
                // Créer un utilisateur d'urgence
                autoCheck.currentUser = {
                    id: 999,
                    name: 'Urgence',
                    email: 'emergency@autocheck.com',
                    role: 'emergency',
                    matricule: 'EMRG-999'
                };
                
                setTimeout(() => {
                    autoCheck.navigateTo('dashboard');
                }, 1000);
            } else {
                autoCheck.showNotification('Code Invalide', 'Code d\'urgence incorrect', 'error');
            }
        }

        // Mot de passe oublié
        function showForgotPassword() {
            autoCheck.showNotification('Contactez l\'Administrateur', 'Pour réinitialiser votre mot de passe, contactez votre administrateur système', 'info');
        }

        // Vérifier la connexion serveur
        async function checkServerConnection() {
            const connectionDot = document.getElementById('connectionDot');
            const connectionText = document.getElementById('connectionText');
            
            try {
                // Simulation de test de connexion
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                if (Math.random() > 0.1) { // 90% de chance de connexion
                    connectionDot.style.backgroundColor = '#10b981';
                    connectionText.textContent = 'Serveur connecté';
                } else {
                    connectionDot.style.backgroundColor = '#f59e0b';
                    connectionText.textContent = 'Mode hors ligne';
                    autoCheck.isOfflineMode = true;
                }
            } catch (error) {
                connectionDot.style.backgroundColor = '#ef4444';
                connectionText.textContent = 'Serveur déconnecté';
                autoCheck.isOfflineMode = true;
            }
        }

        // Mettre à jour les informations système
        function updateSystemInfo() {
            const systemInfo = document.getElementById('systemInfo');
            const now = new Date();
            systemInfo.textContent = `Dernière connexion: ${now.toLocaleString('fr-FR')}`;
        }

        // Gestion des touches clavier
        document.addEventListener('keydown', (e) => {
            // Fermer le modal d'urgence avec Escape
            if (e.key === 'Escape') {
                hideEmergencyAccess();
            }
            
            // Soumettre avec Enter si tous les champs requis sont remplis
            if (e.key === 'Enter' && document.activeElement.tagName !== 'BUTTON') {
                const form = document.getElementById('loginForm');
                if (form.checkValidity()) {
                    form.requestSubmit();
                }
            }
        });
    </script>
</body>
</html>
