<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCheck - Démarrage</title>
    <link href="../output.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        
        .splash-logo {
            animation: logoScale 2s ease-in-out infinite alternate;
        }
        
        @keyframes logoScale {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }
        
        .progress-bar {
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .status-text {
            min-height: 1.5rem;
        }
    </style>
</head>
<body class="splash-screen">
    <div class="min-h-screen flex items-center justify-center text-white">
        <div class="text-center">
            <!-- Logo AutoCheck -->
            <div class="splash-logo mb-8">
                <div class="w-24 h-24 mx-auto mb-4 bg-white rounded-full flex items-center justify-center shadow-2xl">
                    <svg class="w-12 h-12 text-blue-600" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </div>
                <h1 class="text-4xl font-bold mb-2">AutoCheck</h1>
                <p class="text-lg opacity-90">Système de Vérification Véhicules</p>
            </div>

            <!-- Barre de progression -->
            <div class="w-80 bg-white bg-opacity-20 rounded-full h-2 mb-4">
                <div class="progress-bar bg-white h-2 rounded-full" id="progressBar"></div>
            </div>

            <!-- Statut de chargement -->
            <div class="status-text text-sm opacity-75" id="statusText">Initialisation de l'application...</div>

            <!-- Version -->
            <div class="absolute bottom-6 left-0 right-0 text-center">
                <p class="text-xs opacity-60" id="versionText">Version 1.0.0</p>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        const { ipcRenderer } = require('electron');
        
        // États de chargement
        const loadingStates = [
            { text: "Initialisation de l'application...", progress: 20 },
            { text: "Chargement des modules...", progress: 40 },
            { text: "Vérification de la connexion serveur...", progress: 60 },
            { text: "Configuration de la sécurité...", progress: 80 },
            { text: "Finalisation du chargement...", progress: 100 }
        ];

        let currentState = 0;
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const versionText = document.getElementById('versionText');

        // Demander la version de l'application
        ipcRenderer.send('get-app-version');
        ipcRenderer.on('app-version', (event, version) => {
            versionText.textContent = `Version ${version}`;
        });

        // Animation de chargement
        function updateLoadingState() {
            if (currentState < loadingStates.length) {
                const state = loadingStates[currentState];
                statusText.textContent = state.text;
                progressBar.style.width = state.progress + '%';
                
                currentState++;
                
                // Temps d'attente variable pour chaque étape
                const delays = [800, 600, 1000, 600, 400];
                setTimeout(updateLoadingState, delays[currentState - 1] || 500);
            }
        }

        // Test de connexion serveur (simulation)
        async function testServerConnection() {
            return new Promise((resolve) => {
                // Simulation d'un test de connexion
                setTimeout(() => {
                    // 90% de chance de connexion réussie
                    resolve(Math.random() > 0.1);
                }, 1000);
            });
        }

        // Vérification des prérequis
        async function checkPrerequisites() {
            try {
                // Vérifier les données locales
                const hasLocalData = localStorage.getItem('autocheck_user') !== null;
                
                // Tester la connexion serveur
                const serverConnected = await testServerConnection();
                
                if (!serverConnected) {
                    autoCheck.isOfflineMode = true;
                    statusText.textContent = "Mode hors ligne activé - Serveur non disponible";
                    await new Promise(resolve => setTimeout(resolve, 1500));
                }
                
                return true;
            } catch (error) {
                console.error('Erreur lors de la vérification:', error);
                return false;
            }
        }

        // Démarrage de l'application
        async function startApp() {
            // Animation de chargement
            updateLoadingState();
            
            // Attendre que toutes les étapes soient terminées
            await new Promise(resolve => {
                const checkComplete = () => {
                    if (currentState >= loadingStates.length) {
                        resolve();
                    } else {
                        setTimeout(checkComplete, 100);
                    }
                };
                checkComplete();
            });
            
            // Vérifications finales
            await checkPrerequisites();
            
            // Petit délai pour l'effet visuel
            await new Promise(resolve => setTimeout(resolve, 500));
        }

        // Démarrer l'application au chargement de la page
        document.addEventListener('DOMContentLoaded', startApp);
    </script>
</body>
</html>
