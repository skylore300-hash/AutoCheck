<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCheck - Résultat de Vérification</title>
    <link href="../output.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8fafc;
            margin: 0;
            padding: 0;
        }
        
        .status-badge {
            font-size: 3rem;
            padding: 2rem;
            border-radius: 1rem;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .status-safe-big {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            box-shadow: 0 10px 30px -5px rgba(16, 185, 129, 0.3);
        }
        
        .status-stolen-big {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
            box-shadow: 0 10px 30px -5px rgba(239, 68, 68, 0.3);
            animation: pulse-danger 2s infinite;
        }
        
        @keyframes pulse-danger {
            0%, 100% { 
                opacity: 1; 
                transform: scale(1);
            }
            50% { 
                opacity: 0.9; 
                transform: scale(1.02);
            }
        }
        
        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }
        
        .info-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background: white;
            border-radius: 0.5rem;
            border-left: 4px solid #3b82f6;
        }
        
        .info-item.warning {
            border-left-color: #f59e0b;
            background-color: #fffbeb;
        }
        
        .info-item.error {
            border-left-color: #ef4444;
            background-color: #fef2f2;
        }
        
        .info-item.success {
            border-left-color: #10b981;
            background-color: #f0fdf4;
        }
        
        .timeline-item {
            position: relative;
            padding-left: 2rem;
            padding-bottom: 1.5rem;
        }
        
        .timeline-item::before {
            content: '';
            position: absolute;
            left: 0.5rem;
            top: 0.5rem;
            width: 0.75rem;
            height: 0.75rem;
            background-color: #3b82f6;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 0 0 2px #3b82f6;
        }
        
        .timeline-item::after {
            content: '';
            position: absolute;
            left: 0.875rem;
            top: 1.5rem;
            bottom: 0;
            width: 2px;
            background-color: #e5e7eb;
        }
        
        .timeline-item:last-child::after {
            display: none;
        }
        
        .action-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        @media (max-width: 640px) {
            .action-buttons {
                flex-direction: column;
            }
            
            .info-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .blink {
            animation: blink-animation 0.5s steps(2, start) infinite;
        }
        
        @keyframes blink-animation {
            to { visibility: hidden; }
        }
    </style>
</head>

        <!-- Contenu principal -->

                <!-- Informations principales du véhicule -->

                    <div class="card-header" style="margin: -1.5rem -1.5rem 1.5rem;">
                        <h2 style="font-size: 1.5rem; font-weight: bold; margin: 0; display: flex; align-items: center; gap: 0.75rem;">

    <script src="../js/app.js"></script>
    <script>
        let vehicleData = null;

        // Initialisation
        document.addEventListener('DOMContentLoaded', () => {
            // Vérifier la connexion utilisateur
            const user = autoCheck.getCurrentUser();
            if (!user) {
                autoCheck.navigateTo('login');
                return;
            }

            // Récupérer les données du véhicule
            const searchResult = localStorage.getItem('search_result');
            if (!searchResult) {
                autoCheck.showNotification('Aucun Résultat', 'Aucune donnée de recherche trouvée', 'warning');
                autoCheck.navigateTo('search');
                return;
            }

            vehicleData = JSON.parse(searchResult);
            initializeUserInterface(user);
            displaySearchResult(vehicleData);
        });

        // Initialisation de l'interface utilisateur
        function initializeUserInterface(user) {
            document.getElementById('userName').textContent = user.name;
            
            const roleNames = {
                'police': '👮 Agent de Police',
                'insurance': '🏢 Agent d\'Assurance', 
                'transport': '🚛 Agent Transport',
                'admin': '⚙️ Administrateur',
                'emergency': '🚨 Accès d\'Urgence'
            };
            
            document.getElementById('userRole').textContent = roleNames[user.role] || user.role;
        }

        // Afficher le résultat de la recherche
        function displaySearchResult(data) {
            // Badge de statut principal
            const statusBadge = document.getElementById('statusBadge');
            const alertIndicator = document.getElementById('alertIndicator');
            const reportStolenBtn = document.getElementById('reportStolenBtn');

            if (data.status === 'stolen') {
                statusBadge.className = 'status-badge status-stolen-big';
                statusBadge.innerHTML = `
                    <div style="display: flex; align-items: center; justify-content: center; gap: 1rem;">
                        <svg style="width: 4rem; height: 4rem;" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
                        </svg>
                        <div>
                            VÉHICULE VOLÉ
                            <br>
                            <span style="font-size: 1.5rem; font-weight: normal;">⚠️ ALERTE SÉCURITÉ ⚠️</span>
                        </div>
                    </div>
                `;
                alertIndicator.style.display = 'block';
                
                // Jouer l'alerte sonore
                playAlertSound();
                
                // Afficher notification système critique
                autoCheck.showNotification('🚨 VÉHICULE VOLÉ DÉTECTÉ!', `Plaque: ${data.licensePlate} - CONTACTEZ LES AUTORITÉS`, 'error');
                
            } else {
                statusBadge.className = 'status-badge status-safe-big';
                statusBadge.innerHTML = `
                    <div style="display: flex; align-items: center; justify-content: center; gap: 1rem;">
                        <svg style="width: 4rem; height: 4rem;" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                        </svg>
                        <div>
                            VÉHICULE SÉCURISÉ
                            <br>
                            <span style="font-size: 1.5rem; font-weight: normal;">✅ AUCUNE ALERTE</span>
                        </div>
                    </div>
                `;
                reportStolenBtn.style.display = 'inline-flex';
            }

            // Plaque d'immatriculation
            document.getElementById('licensePlate').textContent = data.licensePlate;
            
            // Heure de recherche
            document.getElementById('searchTime').textContent = `Recherche effectuée le ${autoCheck.formatDate(data.searchTimestamp)}`;

            // Informations du véhicule
            displayVehicleInfo(data);
            
            // Informations d'assurance
            displayInsuranceInfo(data.insurance);
            
            // Informations du propriétaire
            displayOwnerInfo(data.owner);
            
            // Historique du véhicule
            generateVehicleHistory(data);
        }

        // Afficher les informations du véhicule
        function displayVehicleInfo(data) {
            const container = document.getElementById('vehicleInfo');
            
            const infoItems = [
                {
                    icon: '<svg style="width: 1.5rem; height: 1.5rem;" fill="currentColor" viewBox="0 0 20 20"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3z"/></svg>',
                    label: 'Marque',
                    value: data.make,
                    type: 'info'
                },
                {
                    icon: '<svg style="width: 1.5rem; height: 1.5rem;" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2H4zm0 2h12v8H4V6z" clip-rule="evenodd"/></svg>',
                    label: 'Modèle',
                    value: data.model,
                    type: 'info'
                },
                {
                    icon: '<svg style="width: 1.5rem; height: 1.5rem;" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/></svg>',
                    label: 'Couleur',
                    value: data.color,
                    type: 'info'
                },
                {
                    icon: '<svg style="width: 1.5rem; height: 1.5rem;" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/></svg>',
                    label: 'Année',
                    value: data.year,
                    type: 'info'
                },
                {
                    icon: '<svg style="width: 1.5rem; height: 1.5rem;" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/></svg>',
                    label: 'VIN',
                    value: data.vin,
                    type: 'info'
                },
                {
                    icon: data.status === 'stolen' ? 
                        '<svg style="width: 1.5rem; height: 1.5rem;" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>' :
                        '<svg style="width: 1.5rem; height: 1.5rem;" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>',
                    label: 'Statut',
                    value: data.status === 'stolen' ? 'VOLÉ' : 'SÉCURISÉ',
                    type: data.status === 'stolen' ? 'error' : 'success'
                }
            ];

            container.innerHTML = infoItems.map(item => `
                <div class="info-item ${item.type}">
                    <div style="color: ${item.type === 'error' ? '#ef4444' : item.type === 'success' ? '#10b981' : '#3b82f6'}; flex-shrink: 0;">
                        ${item.icon}
                    </div>
                    <div>
                        <p style="font-weight: 600; color: #374151; margin: 0; font-size: 0.875rem;">${item.label}</p>
                        <p style="color: #1f2937; margin: 0; font-size: 1.125rem;">${item.value}</p>
                    </div>
                </div>
            `).join('');
        }

        // Afficher les informations d'assurance
        function displayInsuranceInfo(insurance) {
            const container = document.getElementById('insuranceInfo');
            
            const isValid = insurance.valid;
            const statusColor = isValid ? '#10b981' : '#ef4444';
            const statusText = isValid ? 'VALIDE' : 'EXPIRÉE';
            const statusIcon = isValid ? 
                '<svg style="width: 1.25rem; height: 1.25rem;" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>' :
                '<svg style="width: 1.25rem; height: 1.25rem;" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>';

            container.innerHTML = `
                <div style="display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem;">
                    <div style="color: ${statusColor};">${statusIcon}</div>
                    <span style="font-weight: 600; color: ${statusColor}; font-size: 1.125rem;">${statusText}</span>
                </div>
                
                <div style="space-y: 0.75rem;">
                    <div>
                        <p style="font-size: 0.875rem; color: #6b7280; margin: 0;">Compagnie</p>
                        <p style="font-weight: 600; color: #1f2937; margin: 0;">${insurance.company}</p>
                    </div>
                    
                    <div>
                        <p style="font-size: 0.875rem; color: #6b7280; margin: 0;">Expiration</p>
                        <p style="font-weight: 600; color: ${isValid ? '#1f2937' : '#ef4444'}; margin: 0;">
                            ${new Date(insurance.expires).toLocaleDateString('fr-FR')}
                        </p>
                    </div>
                </div>
            `;
        }

        // Afficher les informations du propriétaire
        function displayOwnerInfo(owner) {
            const container = document.getElementById('ownerInfo');
            
            container.innerHTML = `
                <div style="space-y: 0.75rem;">
                    <div>
                        <p style="font-size: 0.875rem; color: #6b7280; margin: 0;">Nom complet</p>
                        <p style="font-weight: 600; color: #1f2937; margin: 0;">${owner.name}</p>
                    </div>
                    
                    <div>
                        <p style="font-size: 0.875rem; color: #6b7280; margin: 0;">Adresse</p>
                        <p style="color: #1f2937; margin: 0; line-height: 1.5;">${owner.address}</p>
                    </div>
                </div>
            `;
        }

        // Générer l'historique du véhicule
        function generateVehicleHistory(data) {
            const container = document.getElementById('vehicleHistory');
            
            // Générer un historique simulé
            const historyEvents = [
                {
                    date: data.searchTimestamp,
                    title: 'Recherche effectuée',
                    description: `Vérification de la plaque ${data.licensePlate}`,
                    icon: '<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd"/></svg>',
                    type: 'info'
                },
                {
                    date: new Date(Date.now() - 86400000 * 30).toISOString(), // 30 jours
                    title: 'Renouvellement assurance',
                    description: `Assurance renouvelée via ${data.insurance.company}`,
                    icon: '<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 1L5 6v6a7 7 0 1010 0V6l-5-5zM6 6.27l4-3.2 4 3.2V12a5 5 0 01-8 0V6.27z" clip-rule="evenodd"/></svg>',
                    type: 'success'
                },
                {
                    date: new Date(Date.now() - 86400000 * 90).toISOString(), // 90 jours
                    title: 'Contrôle technique',
                    description: 'Contrôle technique réussi - Véhicule conforme',
                    icon: '<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/></svg>',
                    type: 'success'
                }
            ];

            // Si véhicule volé, ajouter l'événement de signalement
            if (data.status === 'stolen') {
                historyEvents.unshift({
                    date: new Date(Date.now() - 86400000 * 7).toISOString(), // 7 jours
                    title: '⚠️ SIGNALEMENT VÉHICULE VOLÉ',
                    description: 'Véhicule signalé volé - Signalement actif dans la base de données',
                    icon: '<svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>',
                    type: 'error'
                });
            }

            container.innerHTML = historyEvents.map((event, index) => `
                <div class="timeline-item">
                    <div style="display: flex; align-items: start; gap: 1rem;">
                        <div style="color: ${event.type === 'error' ? '#ef4444' : event.type === 'success' ? '#10b981' : '#3b82f6'}; flex-shrink: 0; margin-top: 0.25rem;">
                            ${event.icon.replace('<svg', '<svg style="width: 1.25rem; height: 1.25rem;"')}
                        </div>
                        <div style="flex: 1; min-width: 0;">
                            <div style="display: flex; justify-content: space-between; align-items: start; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 0.5rem;">
                                <h4 style="font-weight: 600; color: #1f2937; margin: 0; ${event.type === 'error' ? 'color: #ef4444;' : ''}">${event.title}</h4>
                                <span style="font-size: 0.75rem; color: #6b7280; white-space: nowrap;">
                                    ${autoCheck.formatDate(event.date)}
                                </span>
                            </div>
                            <p style="color: #6b7280; font-size: 0.875rem; margin: 0; line-height: 1.4;">${event.description}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Jouer l'alerte sonore
        function playAlertSound() {
            const audio = document.getElementById('alertSound');
            audio.play().catch(e => console.log('Impossible de jouer l\'alerte sonore:', e));
            
            // Répéter l'alerte 3 fois
            let playCount = 0;
            const playAlert = () => {
                audio.currentTime = 0;
                audio.play();
                playCount++;
                if (playCount < 3) {
                    setTimeout(playAlert, 1000);
                }
            };
            
            setTimeout(playAlert, 500);
        }

        // Actions des boutons
        function viewFullDetails() {
            localStorage.setItem('vehicle_details_data', JSON.stringify(vehicleData));
            autoCheck.navigateTo('vehicle-details');
        }

        function exportReport() {
            // Simulation d'export
            autoCheck.showNotification('Export en Cours', 'Génération du rapport PDF...', 'info');
            
            setTimeout(() => {
                autoCheck.showNotification('Export Terminé', 'Rapport sauvegardé dans les téléchargements', 'success');
            }, 2000);
        }

        function reportStolen() {
            if (confirm(`Êtes-vous sûr de vouloir signaler le véhicule ${vehicleData.licensePlate} comme volé ?`)) {
                autoCheck.reportStolenVehicle(vehicleData).then(() => {
                    // Recharger la page avec le nouveau statut
                    vehicleData.status = 'stolen';
                    localStorage.setItem('search_result', JSON.stringify(vehicleData));
                    location.reload();
                });
            }
        }

        function newSearch() {
            autoCheck.navigateTo('search');
        }
    </script>
</body>
</html>
