<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoCheck - Scanner Caméra</title>
    <link href="../output.css" rel="stylesheet">
    <style>
        body {
            background-color: #1f2937;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        .camera-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #videoElement {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .camera-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 200px;
            border: 3px solid #3b82f6;
            border-radius: 12px;
            background: transparent;
            box-shadow: 0 0 0 2000px rgba(0, 0, 0, 0.5);
        }

        .scanning-line {
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #3b82f6, transparent);
            animation: scan 2s linear infinite;
            position: absolute;
            top: 50%;
        }

        @keyframes scan {
            0% { transform: translateY(-100px); }
            100% { transform: translateY(100px); }
        }

        .camera-controls {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .control-btn {
            width: 4rem;
            height: 4rem;
            border-radius: 50%;
            border: 3px solid white;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(10px);
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        .control-btn.primary {
            width: 5rem;
            height: 5rem;
            border-color: #3b82f6;
            background: #3b82f6;
        }

        .camera-info {
            position: absolute;
            top: 2rem;
            left: 2rem;
            right: 2rem;
            color: white;
            z-index: 10;
        }

        .detection-result {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            min-width: 200px;
            backdrop-filter: blur(10px);
        }

        .corner-guides {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 200px;
            pointer-events: none;
        }

        .corner-guide {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #3b82f6;
        }

        .corner-guide.top-left {
            top: -2px;
            left: -2px;
            border-right: none;
            border-bottom: none;
        }

        .corner-guide.top-right {
            top: -2px;
            right: -2px;
            border-left: none;
            border-bottom: none;
        }

        .corner-guide.bottom-left {
            bottom: -2px;
            left: -2px;
            border-right: none;
            border-top: none;
        }

        .corner-guide.bottom-right {
            bottom: -2px;
            right: -2px;
            border-left: none;
            border-top: none;
        }

        .exit-btn {
            position: absolute;
            top: 1rem;
            left: 1rem;
            z-index: 20;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 50%;
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }

        .exit-btn:hover {
            background: rgba(0, 0, 0, 0.7);
        }

        .camera-error {
            color: white;
            text-align: center;
            padding: 2rem;
        }

        .plate-detected {
            font-family: 'Courier New', monospace;
            font-size: 1.5rem;
            font-weight: bold;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            border: 2px solid #10b981;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            margin-top: 0.5rem;
            letter-spacing: 2px;
            text-align: center;
        }

        .confidence-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #ef4444, #f59e0b, #10b981);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
    </style>
</head>
<body>
    <!-- Bouton de sortie -->
    <button class="exit-btn" onclick="exitCamera()">
        <svg style="width: 1.5rem; height: 1.5rem;" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
    </button>

    <!-- Container principal de la caméra -->
    <div class="camera-container">
        <!-- Élément vidéo -->
        <video id="videoElement" autoplay playsinline></video>
        
        <!-- Message d'erreur caméra -->
        <div id="cameraError" class="camera-error" style="display: none;">
            <div style="margin-bottom: 2rem;">
                <svg style="width: 4rem; height: 4rem; color: #ef4444; margin: 0 auto; display: block;" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/>
                </svg>
            </div>
            <h2 style="margin: 0 0 1rem; color: #ef4444;">Caméra non disponible</h2>
            <p style="margin: 0 0 2rem; color: #d1d5db;">Impossible d'accéder à la caméra. Vérifiez les permissions.</p>
            <button class="btn-primary" onclick="retryCamera()">Réessayer</button>
            <button class="btn-secondary" style="margin-left: 1rem;" onclick="exitCamera()">Retour</button>
        </div>

        <!-- Overlay de cadrage -->
        <div id="cameraOverlay" class="camera-overlay" style="display: none;">
            <div class="scanning-line" id="scanningLine"></div>
            
            <!-- Guides d'angle -->
            <div class="corner-guides">
                <div class="corner-guide top-left"></div>
                <div class="corner-guide top-right"></div>
                <div class="corner-guide bottom-left"></div>
                <div class="corner-guide bottom-right"></div>
            </div>
        </div>

        <!-- Informations caméra -->
        <div id="cameraInfo" class="camera-info" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <div>
                    <h2 style="margin: 0 0 0.5rem; font-size: 1.5rem;">📷 Scanner AutoCheck</h2>
                    <p style="margin: 0; opacity: 0.8;">Placez la plaque d'immatriculation dans le cadre</p>
                </div>
                <div style="text-align: right;">
                    <div style="background: rgba(255, 255, 255, 0.1); padding: 0.5rem 1rem; border-radius: 0.5rem; backdrop-filter: blur(10px);">
                        <span id="detectionStatus">En attente...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Résultat de détection -->
        <div id="detectionResult" class="detection-result" style="display: none;">
            <h3 style="margin: 0 0 1rem; color: #10b981;">Plaque Détectée</h3>
            <div id="detectedPlate" class="plate-detected">AB-123-CD</div>
            <div style="margin-top: 1rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                    <span style="font-size: 0.875rem;">Confiance</span>
                    <span id="confidenceText" style="font-size: 0.875rem;">85%</span>
                </div>
                <div class="confidence-bar">
                    <div id="confidenceFill" class="confidence-fill" style="width: 85%;"></div>
                </div>
            </div>
            <div style="margin-top: 1rem; display: flex; gap: 0.5rem;">
                <button class="btn-success" style="flex: 1; padding: 0.5rem;" onclick="acceptDetection()">
                    ✓ Accepter
                </button>
                <button class="btn-secondary" style="padding: 0.5rem;" onclick="retakePhoto()">
                    📷
                </button>
            </div>
        </div>

        <!-- Contrôles de la caméra -->
        <div id="cameraControls" class="camera-controls" style="display: none;">
            <!-- Bouton de flash -->
            <div class="control-btn" onclick="toggleFlash()" title="Flash">
                <svg id="flashIcon" style="width: 1.5rem; height: 1.5rem;" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.381z" clip-rule="evenodd"/>
                </svg>
            </div>

            <!-- Bouton de capture -->
            <div class="control-btn primary" onclick="captureImage()" title="Capturer">
                <svg style="width: 2rem; height: 2rem;" fill="currentColor" viewBox="0 0 20 20">
                    <path fill-rule="evenodd" d="M4 5a2 2 0 00-2 2v6a2 2 0 002 2h12a2 2 0 002-2V7a2 2 0 00-2-2h-1.586a1 1 0 01-.707-.293l-1.121-1.121A2 2 0 0011.172 3H8.828a2 2 0 00-1.414.586L6.293 4.707A1 1 0 015.586 5H4zm6 9a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
                </svg>
            </div>

            <!-- Bouton de changement de caméra -->
            <div class="control-btn" onclick="switchCamera()" title="Changer caméra" id="switchCameraBtn">
                <svg style="width: 1.5rem; height: 1.5rem;" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M5 12a1 1 0 102 0V6.414l1.293 1.293a1 1 0 001.414-1.414l-3-3a1 1 0 00-1.414 0l-3 3a1 1 0 001.414 1.414L5 6.414V12zM15 8a1 1 0 10-2 0v5.586l-1.293-1.293a1 1 0 00-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L15 13.586V8z"/>
                </svg>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script>
        // Variables globales
        let videoStream = null;
        let currentCamera = 'environment'; // 'user' ou 'environment'
        let isFlashOn = false;
        let detectionInterval = null;
        let isDetecting = false;

        // Initialisation
        document.addEventListener('DOMContentLoaded', async () => {
            await initializeCamera();
            startPlateDetection();
        });

        // Initialiser la caméra
        async function initializeCamera() {
            try {
                // Arrêter le stream existant s'il y en a un
                if (videoStream) {
                    videoStream.getTracks().forEach(track => track.stop());
                }

                // Configuration de la caméra
                const constraints = {
                    video: {
                        facingMode: currentCamera,
                        width: { ideal: 1280, min: 640 },
                        height: { ideal: 720, min: 480 }
                    },
                    audio: false
                };

                // Demander l'accès à la caméra
                videoStream = await navigator.mediaDevices.getUserMedia(constraints);
                
                const videoElement = document.getElementById('videoElement');
                videoElement.srcObject = videoStream;

                // Afficher les contrôles une fois la vidéo prête
                videoElement.addEventListener('loadedmetadata', () => {
                    document.getElementById('cameraOverlay').style.display = 'block';
                    document.getElementById('cameraInfo').style.display = 'block';
                    document.getElementById('cameraControls').style.display = 'flex';
                    document.getElementById('cameraError').style.display = 'none';
                    
                    autoCheck.showNotification('Caméra Active', 'Scanner prêt à détecter les plaques', 'success');
                });

                // Gérer les erreurs de lecture vidéo
                videoElement.addEventListener('error', (e) => {
                    console.error('Erreur vidéo:', e);
                    showCameraError();
                });

            } catch (error) {
                console.error('Erreur caméra:', error);
                showCameraError();
            }
        }

        // Afficher l'erreur de caméra
        function showCameraError() {
            document.getElementById('cameraError').style.display = 'block';
            document.getElementById('cameraOverlay').style.display = 'none';
            document.getElementById('cameraInfo').style.display = 'none';
            document.getElementById('cameraControls').style.display = 'none';
            document.getElementById('detectionResult').style.display = 'none';
        }

        // Démarrer la détection automatique
        function startPlateDetection() {
            // Simulation de détection OCR toutes les 2 secondes
            detectionInterval = setInterval(() => {
                if (!isDetecting) {
                    simulateOCRDetection();
                }
            }, 2000);
        }

        // Arrêter la détection
        function stopPlateDetection() {
            if (detectionInterval) {
                clearInterval(detectionInterval);
                detectionInterval = null;
            }
        }

        // Simulation de détection OCR
        function simulateOCRDetection() {
            const statusElement = document.getElementById('detectionStatus');
            
            // 30% de chance de détecter une plaque
            if (Math.random() < 0.3) {
                const plates = ['AB-123-CD', 'EF-456-GH', 'IJ-789-KL', 'MN-012-OP', 'QR-345-ST'];
                const randomPlate = plates[Math.floor(Math.random() * plates.length)];
                const confidence = Math.floor(Math.random() * 30) + 70; // 70-100%
                
                showDetectedPlate(randomPlate, confidence);
                statusElement.textContent = 'Plaque détectée!';
                
                // Vibration si supportée
                if (navigator.vibrate) {
                    navigator.vibrate([100, 50, 100]);
                }
                
            } else {
                statusElement.textContent = 'Recherche en cours...';
                
                // Messages de statut aléatoires
                const messages = [
                    'En attente...',
                    'Analyse de l\'image...',
                    'Recherche de caractères...',
                    'Ajustez l\'angle de la caméra'
                ];
                
                setTimeout(() => {
                    if (!isDetecting) {
                        statusElement.textContent = messages[Math.floor(Math.random() * messages.length)];
                    }
                }, 500);
            }
        }

        // Afficher une plaque détectée
        function showDetectedPlate(plate, confidence) {
            isDetecting = true;
            stopPlateDetection();
            
            const resultDiv = document.getElementById('detectionResult');
            const plateDiv = document.getElementById('detectedPlate');
            const confidenceText = document.getElementById('confidenceText');
            const confidenceFill = document.getElementById('confidenceFill');
            
            plateDiv.textContent = plate;
            confidenceText.textContent = confidence + '%';
            confidenceFill.style.width = confidence + '%';
            
            // Couleur de confiance
            if (confidence >= 85) {
                plateDiv.style.borderColor = '#10b981';
                plateDiv.style.backgroundColor = 'rgba(16, 185, 129, 0.1)';
            } else if (confidence >= 70) {
                plateDiv.style.borderColor = '#f59e0b';
                plateDiv.style.backgroundColor = 'rgba(245, 158, 11, 0.1)';
            } else {
                plateDiv.style.borderColor = '#ef4444';
                plateDiv.style.backgroundColor = 'rgba(239, 68, 68, 0.1)';
            }
            
            resultDiv.style.display = 'block';
            
            // Son de détection
            playDetectionSound();
        }

        // Accepter la détection
        async function acceptDetection() {
            const plate = document.getElementById('detectedPlate').textContent;
            
            autoCheck.showNotification('Plaque Capturée', `Recherche de ${plate} en cours...`, 'info');
            
            // Arrêter la caméra
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            
            // Effectuer la recherche
            try {
                const result = await autoCheck.searchVehicle(plate);
                localStorage.setItem('search_result', JSON.stringify(result));
                autoCheck.navigateTo('search-result');
            } catch (error) {
                autoCheck.showNotification('Erreur', 'Impossible de traiter la recherche', 'error');
                retakePhoto();
            }
        }

        // Reprendre la photo
        function retakePhoto() {
            isDetecting = false;
            document.getElementById('detectionResult').style.display = 'none';
            startPlateDetection();
        }

        // Capturer une image manuellement
        function captureImage() {
            const video = document.getElementById('videoElement');
            
            // Créer un canvas pour capturer l'image
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0);
            
            // Simuler le traitement OCR
            setTimeout(() => {
                simulateOCRDetection();
            }, 500);
            
            autoCheck.showNotification('Image Capturée', 'Analyse de la plaque en cours...', 'info');
        }

        // Basculer le flash
        function toggleFlash() {
            const flashIcon = document.getElementById('flashIcon');
            
            if (videoStream) {
                const track = videoStream.getVideoTracks()[0];
                const capabilities = track.getCapabilities();
                
                if (capabilities.torch) {
                    isFlashOn = !isFlashOn;
                    
                    track.applyConstraints({
                        advanced: [{
                            torch: isFlashOn
                        }]
                    }).then(() => {
                        if (isFlashOn) {
                            flashIcon.style.color = '#fbbf24';
                        } else {
                            flashIcon.style.color = 'white';
                        }
                    }).catch(e => {
                        console.log('Flash non supporté:', e);
                        autoCheck.showNotification('Flash Indisponible', 'Le flash n\'est pas supporté sur cet appareil', 'warning');
                    });
                } else {
                    autoCheck.showNotification('Flash Indisponible', 'Le flash n\'est pas disponible', 'warning');
                }
            }
        }

        // Changer de caméra
        async function switchCamera() {
            const switchBtn = document.getElementById('switchCameraBtn');
            switchBtn.style.opacity = '0.5';
            
            try {
                currentCamera = currentCamera === 'environment' ? 'user' : 'environment';
                await initializeCamera();
                
                const cameraName = currentCamera === 'environment' ? 'Caméra arrière' : 'Caméra avant';
                autoCheck.showNotification('Caméra Changée', cameraName, 'info');
                
            } catch (error) {
                console.error('Erreur changement caméra:', error);
                // Revenir à la caméra précédente
                currentCamera = currentCamera === 'environment' ? 'user' : 'environment';
                autoCheck.showNotification('Erreur', 'Impossible de changer de caméra', 'error');
            }
            
            switchBtn.style.opacity = '1';
        }

        // Réessayer la caméra
        async function retryCamera() {
            await initializeCamera();
        }

        // Sortir de la caméra
        function exitCamera() {
            // Arrêter la détection
            stopPlateDetection();
            
            // Arrêter la caméra
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
            
            // Naviguer vers la recherche
            autoCheck.navigateTo('search');
        }

        // Son de détection
        function playDetectionSound() {
            // Créer un contexte audio pour le son de détection
            if (window.AudioContext || window.webkitAudioContext) {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.setValueAtTime(1000, audioContext.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0, audioContext.currentTime);
                gainNode.gain.linearRampToValueAtTime(0.3, audioContext.currentTime + 0.01);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
                
                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            }
        }

        // Gérer la rotation de l'écran
        window.addEventListener('orientationchange', () => {
            setTimeout(async () => {
                if (videoStream) {
                    await initializeCamera();
                }
            }, 500);
        });

        // Gérer les raccourcis clavier
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case ' ':
                case 'Enter':
                    e.preventDefault();
                    captureImage();
                    break;
                case 'Escape':
                    e.preventDefault();
                    exitCamera();
                    break;
                case 'f':
                case 'F':
                    e.preventDefault();
                    toggleFlash();
                    break;
                case 'c':
                case 'C':
                    e.preventDefault();
                    switchCamera();
                    break;
            }
        });

        // Nettoyage au déchargement de la page
        window.addEventListener('beforeunload', () => {
            stopPlateDetection();
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
        });
    </script>
</body>
</html>
